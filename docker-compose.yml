name: opsboard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opsboard}
      POSTGRES_USER: ${POSTGRES_USER:-opsboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsboard}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./backend/sql/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    networks:
      - opsboard

  migrate:
    build:
      context: ./backend
    image: opsboard-api:${IMAGE_TAG:-local}
    command: ["npm", "run", "migrate"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-opsboard}:${POSTGRES_PASSWORD:-opsboard}@postgres:5432/${POSTGRES_DB:-opsboard}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    networks:
      - opsboard

  backend:
    build:
      context: ./backend
    image: opsboard-api:${IMAGE_TAG:-local}
    init: true
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-opsboard}:${POSTGRES_PASSWORD:-opsboard}@postgres:5432/${POSTGRES_DB:-opsboard}
      FRONTEND_URL: http://localhost:${FRONTEND_HOST_PORT:-8080}
    expose:
      - "4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    networks:
      - opsboard

  frontend:
    build:
      context: ./frontend
    image: opsboard-web:${IMAGE_TAG:-local}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    networks:
      - opsboard

volumes:
  postgres-data:

networks:
  opsboard:
    driver: bridge
